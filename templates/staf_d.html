<!doctype html>
<html>
<head>
  <title>Staff Dashboard</title>
</head>
<body>
  <h2>Staff Dashboard</h2>
  <p><a href="{{ url_for('logout') }}">Logout</a></p>

  <h3>Your Assigned Treks</h3>

  {% if treks and treks|length > 0 %}
    <ul>
      {% for trek in treks %}
        <li>{{ trek.name }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No treks have been assigned to you yet.</p>
  {% endif %}
</body>
</html>
