{% extends "base.html" %}

{% block title %}Trekker Sign Up{% endblock %}

{% block content %}
<div class="auth-card" style="margin: 40px auto;">
  <div class="auth-title">
    <h1>Trek Management</h1>
    <p style="color:#6b7280;">Create your trekker account</p>
  </div>

  <form method="POST" action="{{ url_for('signup_trekker') }}">
    <div class="form-row">
      <label>Name</label>
      <input name="name" required>
    </div>

    <div class="form-row">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>

    <div class="form-row">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>

    <div style="text-align: center;">
      <button class="btn" type="submit">sign up</button>
    </div>
  </form>


</div>
{% endblock %}
