{% extends "base.html" %}

{% block title %}Trek Management Login{% endblock %}

{% block content %}
<div class="auth-card" style="margin: 40px auto;">
  <div class="auth-title">
    <h1>TrekEase</h1>
    <p style="color:#6b7280;">Login to continue</p>
  </div>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-row">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>

    <div class="form-row">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>

    <div style="text-align: center;">
      <button class="btn" type="submit">Login</button>
    </div>
  </form>

  <hr style="border:none; border-top:1px solid #e5e7eb; margin:18px 0;">

  <div class="actions-inline" style="justify-content:center;">
    <a class="btn" href="{{ url_for('signup_trekker') }}">Sign Up Trekker</a>
    <a class="btn" href="{{ url_for('signup_staff') }}">Sign Up Staff</a>
  </div>
</div>
{% endblock %}
