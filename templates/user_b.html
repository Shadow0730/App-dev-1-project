<!doctype html>
<html>
<head><title>My Bookings</title></head>
<body>
  <h2>My Booked Treks</h2>
  <a href="{{ url_for('user_dashboard') }}">Back to Dashboard</a>

  {% if bookings %}
    <table border="1" cellpadding="8">
      <tr>
        <th>Booking ID</th>
        <th>Trek</th>
        <th>Location</th>
        <th>Status</th>
        <th>Payment</th>
      </tr>
      {% for b in bookings %}
      <tr>
        <td>{{ b.id }}</td>
        <td>{{ b.trek.name }}</td>
        <td>{{ b.trek.location }}</td>
        <td>{{ b.booking_status }}</td>
        <td>{{ b.payment_status }}</td>
      </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>You have no bookings yet.</p>
  {% endif %}
</body>
</html>
